# Example: Create AWS credentials secret
# 
# Option 1: Using kubectl (recommended)
# kubectl create secret generic aws-credentials \
#   --from-literal=AWS_ACCESS_KEY_ID=your_access_key \
#   --from-literal=AWS_SECRET_ACCESS_KEY=your_secret_key \
#   --from-literal=AWS_REGION=us-west-2
#
# Option 2: Using YAML (base64 encode values first)
# echo -n "your_access_key" | base64
# echo -n "your_secret_key" | base64
# echo -n "us-west-2" | base64

apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
type: Opaque
data:
  # Base64 encoded values
  # Replace these with your actual base64-encoded credentials
  AWS_ACCESS_KEY_ID: eW91cl9hY2Nlc3Nfa2V5
  AWS_SECRET_ACCESS_KEY: eW91cl9zZWNyZXRfa2V5
  AWS_REGION: dXMtd2VzdC0y

