apiVersion: v1
kind: Service
metadata:
  name: vllm-s3-service
spec:
  selector:
    app: vllm-s3
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-s3-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-s3
  template:
    metadata:
      labels:
        app: vllm-s3
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        command:
          - /bin/bash
          - -c
          - |
            # Install S3 connector
            pip install git+https://github.com/llm-d/llm-d-kv-cache-manager.git#subdirectory=kv_connectors/llmd_s3_backend
            
            # Start vLLM server
            python -m vllm.entrypoints.openai.api_server \
              --model meta-llama/Llama-3.1-70B-Instruct \
              --tensor-parallel-size 8 \
              --kv-transfer-config '{
                "kv_connector": "OffloadingConnector",
                "kv_role": "kv_both",
                "kv_connector_extra_config": {
                  "spec_name": "S3OffloadingSpec",
                  "spec_module_path": "llmd_s3_backend.spec",
                  "s3_bucket": "my-kv-cache-bucket",
                  "s3_prefix": "kv-cache",
                  "s3_region": "us-west-2",
                  "block_size": 256,
                  "threads_per_gpu": 64,
                  "max_staging_memory_gb": 150
                }
              }' \
              --distributed-executor-backend mp \
              --host 0.0.0.0 \
              --port 8000
        ports:
        - containerPort: 8000
        env:
        # AWS credentials (if not using IAM roles)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_REGION
              optional: true
        # HuggingFace token
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        # Optional: Enable debug logging
        - name: STORAGE_CONNECTOR_DEBUG
          value: "0"
        resources:
          requests:
            nvidia.com/gpu: 8
            memory: "200Gi"
            cpu: "32"
          limits:
            nvidia.com/gpu: 8
            memory: "200Gi"
            cpu: "32"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      # Optional: Use IAM role for service account (EKS)
      # serviceAccountName: vllm-s3-sa

